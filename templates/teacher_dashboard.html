<!DOCTYPE html>
<html>
<head>
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .container{
            width: 100%;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Teacher Dashboard</h1>

    <!-- ------------------------------------Add student---------------------------------------- -->
    <!-- New Student Add Form -->

<h2>Add Student</h2>
<form action="/teacher_add_student" method="POST">
    <input
        type="text"
        name="name"
        placeholder="Student Name"
        required>
    <input
        type="text"
        name="roll_no"
        placeholder="Roll Number"
        required>
    <input
        type="text"
        name="id"
        placeholder="Id"
        required>
        <input
        type="email"
        name="email"
        placeholder="Student Email"
        required>
    <input
        type="password"
        name="password"
        placeholder="Password"
        required>
    <button type="submit">
        Add Student
    </button>
</form>
<hr>
<!-- ------------------------------------------------------------------------------------------------ -->
    <hr>
    <table border="1" width="100%">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Roll No</th>
            <th>id</th>
            <th>Action</th>
        </tr>
        {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.roll_no }}</td>
            <td>{{ student.id }}</td>
            <td>
                <a href="/delete/{{ student.email }}">
                    <button>
                        Delete
                    </button>
                </a>
                <a href="/update_student/{{ student.email }}?teacher_email={{ teacher.email }}">
                    <button>
                        update
                    </button>
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href="/teacher_login">
        <button>Logout</button>
    </a>
</div>
</body>
</html>
